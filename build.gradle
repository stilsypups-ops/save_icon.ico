plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }

    // Основной репозиторий LowDragMC (Photon / LDLib2)
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" }

    // Резервный репозиторий LowDragMC
    maven { url = "https://maven.firstdark.dev/snapshots" }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"

    // === Photon + LDLib2 (встраиваются в мод через jarJar) ===
    // LDLib2: классификатор 'all' несёт в себе его собственные библиотеки
    jarJar(implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:2.2.43:all")) {
        version { require "2.2.43" }
    }

    // Photon: классификатор 'all' уже содержит KilaGraph 21.1.0.15 внутри
    jarJar(implementation("com.lowdragmc.photon:photon-neoforge-${minecraft_version}:2.2.9:all")) {
        version { require "2.2.9" }
    }

    // KilaGraph отдельно НЕ нужен — он вложен в Photon 'all' jar.
    // Если твой код напрямую использует классы KilaGraph, раскомментируй:
    // compileOnly "com.lowdragmc.kilagraph:kilagraph-neoforge-${minecraft_version}:21.1.0.15"

    // Для тестирования в рантайме из IDE (раскомментируй при необходимости):
    // localRuntime("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:2.2.43:all")
    // localRuntime("com.lowdragmc.photon:photon-neoforge-${minecraft_version}:2.2.9:all")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}